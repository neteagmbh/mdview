[package]
name = "mdview"
version = "0.2.0"
description = "A small, cross-platform Markdown viewer"
authors = ["mdview contributors"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "mdview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
notify = "8.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "~2.12.0", features = ["protocol-asset"] }
tauri-plugin-dialog = "~2.7.2"
tauri-plugin-opener = "~2.5.4"
tempfile = "3"

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39.1"
# Match webview2-com so its COM interfaces share the same windows::core::Interface trait.
windows = { version = "0.62", features = [] }

[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-documents = { path = "plugins/documents" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-pdf-kit = { version = "0.3.2", default-features = false, features = ["std", "PDFDocument", "PDFPage", "objc2-app-kit"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPrintInfo", "NSPrintOperation", "NSWindow", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSObject", "NSData", "NSString"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-app-kit", "WKWebView"] }

# Xcode 27 SwiftPM hides swift-rs C exports in release static libraries.
# Tauri builds its native Swift package according to Cargo's DEBUG flag.
# Keep that bridge in debug mode while Rust retains release optimization.
# Remove after https://github.com/tauri-apps/tauri/issues/16130 is resolved.
[profile.release.package.tauri]
debug = "line-tables-only"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
